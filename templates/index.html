<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-info text-white">
    <div class="container text-center">
        <h1 class="mt-5">Weather App</h1>
        <form action="/" method="POST" class="mt-4">
            <input type="text" name="cityName" placeholder="Enter city name" class="form-control w-50 mx-auto">
            <button type="submit" class="btn btn-primary mt-3">Find</button>
        </form>

        {% if error %}
            <div class="alert alert-danger mt-4 w-50 mx-auto">{{ error }}</div>
        {% endif %}

        {% if city %}
            <div class="mt-4">
                <h4>Weather in {{ city }}</h4>
                <p><strong>Condition:</strong> {{ weather }}</p>
                <p><strong>Temperature:</strong> {{ temp_c }}°C </p>
                <img src="{{ icon_url }}" alt="Weather Icon">
            </div>
        {% endif %}
    </div>
</body>
</html>
